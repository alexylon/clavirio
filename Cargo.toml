[package]
name = "clavirio"
version = "0.4.5"
edition = "2021"

authors = ["Alexander Alexandrov"]
description = "A terminal typing tutor with virtual keyboard, built-in lessons, and session tracking"
license = "Apache-2.0 AND CC-BY-SA-3.0"
homepage = "https://clavir.io"
repository = "https://github.com/alexylon/clavirio"
documentation = "https://docs.rs/clavirio"
keywords = ["typing", "tutor", "keyboard", "tui", "ratatui"]
categories = ["command-line-utilities"]
include = [
    "/src/",
    "/assets/lessons/",
    "/assets/quotes/",
    "/assets/words/",
    "/man/",
    "/sample.txt",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
]

# The .deb attached to each GitHub release, built with cargo-deb
[package.metadata.deb]
maintainer = "Alexander Alexandrov <git@alexo.io>"
copyright = "2026 Alexander Alexandrov and contributors"
license-file = ["LICENSE", "0"]
# No Debian revision (0.4.5, not 0.4.5-1), so these packages never share a
# version with an official Debian package, which then sorts higher
revision = ""
section = "education"
priority = "optional"
extended-description = """\
Clavirio teaches touch typing in the terminal. The lessons go through the \
keyboard row by row for QWERTY, Dvorak and Colemak, then cover numbers and \
symbols. A keyboard drawn on screen shows the next key and which finger to use.

Besides the lessons, you can practice with random English words, code terms \
for several programming languages, timed tests, quotes, and drills of the keys \
you miss most. Speed and accuracy are shown as you type, and every session is \
saved to a history."""
assets = [
    ["target/release/clavirio", "usr/bin/", "755"],
    ["man/clavirio.1", "usr/share/man/man1/", "644"],
    ["NOTICE", "usr/share/doc/clavirio/", "644"],
]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
time = { version = "0.3.47", features = ["local-offset", "formatting"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal"] }
unicode-normalization = "0.1"
unicode-width = "0.2"

[profile.release]
lto = true
