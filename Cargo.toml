[package]
name = "clavirio"
version = "0.4.4"
edition = "2021"

authors = ["Alexander Alexandrov"]
description = "A terminal typing tutor with virtual keyboard, built-in lessons, and session tracking"
license = "Apache-2.0 AND CC-BY-SA-3.0"
homepage = "https://clavir.io"
repository = "https://github.com/alexylon/clavirio"
documentation = "https://docs.rs/clavirio"
keywords = ["typing", "tutor", "keyboard", "tui", "ratatui"]
categories = ["command-line-utilities"]
include = [
    "/src/",
    "/assets/lessons/",
    "/assets/quotes/",
    "/assets/words/",
    "/man/",
    "/sample.txt",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
time = { version = "0.3.47", features = ["local-offset", "formatting"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal"] }
unicode-normalization = "0.1"
unicode-width = "0.2"

[profile.release]
lto = true
